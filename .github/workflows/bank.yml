name: bank

on:
  push:
    paths: [questions.json, models.json, tools/**, .github/workflows/bank.yml]
  pull_request:
    paths: [questions.json, models.json, tools/**]
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      since:
        description: "days to scan"
        default: "14"

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/gen_bank.py --check

  draft:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: gen
        run: |
          SINCE="${{ github.event.inputs.since || '14' }}"
          python3 tools/gen_bank.py --since "$SINCE" --with-canaries 2 -o bank-draft.json
          n=$(sed -n 's/^DRAFTS: //p' "$GITHUB_STEP_SUMMARY" 2>/dev/null || true)
          n=$(python3 -c "import json;print(len(json.load(open('bank-draft.json'))['drafts']))")
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - if: steps.gen.outputs.n != '0'
        run: |
          git config user.name "bank-bot"
          git config user.email "actions@github.com"
          BR="bank-draft-$(date -u +%Y%m%d)"
          git checkout -b "$BR"
          git add bank-draft.json
          git commit -m "bank draft $(date -u +%F)"
          git push origin "HEAD:$BR"
          gh pr create --title "Bank draft $(date -u +%F)" \
            --body "Review bank-draft.json: fill question+truth for kept items, drop guessable ones (flags mark suspects), then run python3 tools/gen_bank.py --merge bank-draft.json and push to this branch."
        env:
          GH_TOKEN: ${{ github.token }}
