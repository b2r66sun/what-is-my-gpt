name: bank

on:
  push:
    paths: [questions.json, models.json, tools/**, .github/workflows/bank.yml]
  pull_request:
    paths: [questions.json, models.json, tools/**, .github/workflows/bank.yml]
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "thin (fill weak gaps) | since (recent days)"
        type: choice
        default: thin
        options: [thin, since]
      days:
        description: "days to scan (since mode)"
        type: number
        default: 14

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/gen_bank.py --check

  raw:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: gen
        run: |
          MODE="${{ github.event.inputs.mode || 'thin' }}"
          SEED="${{ github.run_number }}${{ github.run_attempt }}"
          if [ "$MODE" = "since" ]; then
            DAYS="${{ github.event.inputs.days || '14' }}"
            python3 tools/gen_bank.py --context --since "$DAYS" --seed "$SEED" --with-canaries 2 -o raw-context.md
          else
            python3 tools/gen_bank.py --context --thin --seed "$SEED" --with-canaries 2 -o raw-context.md
          fi
      # fetch-all-failed => script exits 1 => job fails => no PR
      - if: always() && steps.gen.outcome == 'success'
        run: |
          git config user.name "bank-bot"
          git config user.email "actions@github.com"
          BR="bank-ctx-$(date -u +%Y%m%d)-r${{ github.run_number }}-${{ github.run_attempt }}"
          # close stale open bank PRs instead of piling up
          for pr in $(gh pr list --state open --limit 30 --json number,headRefName \
                --jq '.[] | select(.headRefName | startswith("bank-ctx-")) | .number'); do
            gh pr close "$pr" --comment "superseded by a newer bank run"
          done
          git checkout -b "$BR"
          git add -f raw-context.md raw-context.canaries.json
          git commit -m "bank context $(date -u +%F)"
          git push origin "HEAD:$BR"
          gh pr create --title "Bank context $(date -u +%F)" \
            --body "raw-context.md (flattened events with gap/RESERVE labels + article summaries; Coverage section lists thin gaps). Run the agent task in tools/agent-task.md (gh-aw or any agent CLI) or draft manually, then: python3 tools/gen_bank.py --merge bank-draft.json"
        env:
          GH_TOKEN: ${{ github.token }}
